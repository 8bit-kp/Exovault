name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Throwaway CI-only values; config/env.ts validates their shape.
      MONGODB_URI: mongodb://127.0.0.1:27017/exovault
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/exovault_test
      IDENTIFIER_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      IDENTIFIER_ENCRYPTION_ACTIVE_KEY_ID: v1
      BLIND_INDEX_PEPPER: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # Integration, security, and E2E suites are added in later phases.
      - run: npm run build
      # Production dependencies only; dev-tool advisories are tracked in docs/DECISIONS.md (D-008).
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
