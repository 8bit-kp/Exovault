name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Standalone MongoDB, same topology as local dev (D-004). Used by E2E; integration tests use mongodb-memory-server.
      mongo:
        image: mongo:8.2
        ports: ["27017:27017"]
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31
        ports: ["1025:1025", "8025:8025"]
    env:
      # Throwaway CI-only values; config/env.ts validates their shape.
      MONGODB_URI: mongodb://127.0.0.1:27017/exovault
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/exovault_test
      IDENTIFIER_ENCRYPTION_KEYS: v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      IDENTIFIER_ENCRYPTION_ACTIVE_KEY_ID: v1
      BLIND_INDEX_PEPPER: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      PASSWORD_BREACH_CHECK: "off"
      # The E2E job runs a production build with the throwaway keys above (D-035).
      EXOVAULT_ALLOW_TEST_SECRETS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      # Integration + security suites: in-memory standalone MongoDB, real Redis (DB 15).
      - run: npm run test:integration
      - run: npm run build
      - run: npm run worker:build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      # Production dependencies only; dev-tool advisories are tracked in docs/DECISIONS.md (D-008).
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Both images must build from a clean context with no secrets (spec 4.4). Not pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag exovault-web:ci .
      - run: docker build --file Dockerfile.worker --tag exovault-worker:ci .
